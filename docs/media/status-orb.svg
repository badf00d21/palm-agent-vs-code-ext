<svg xmlns="http://www.w3.org/2000/svg" width="88" height="88" viewBox="0 0 100 100" role="img" aria-label="Palm Agent status orb">
  <defs>
    <linearGradient id="shell" x1="50" y1="0" x2="50" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffbf4740"/>
      <stop offset="100%" stop-color="#bf4a1d80"/>
    </linearGradient>
    <linearGradient id="lava" x1="50" y1="0" x2="50" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="30%" stop-color="#ffbf48"/>
      <stop offset="70%" stop-color="#be4a1d"/>
    </linearGradient>
    <filter id="hue" x="-20%" y="-20%" width="140%" height="140%">
      <feColorMatrix type="hueRotate" values="0">
        <animate attributeName="values" values="0;-30;-60;-90;-45;0" dur="6s" repeatCount="indefinite"/>
      </feColorMatrix>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <mask id="clip">
      <rect width="100" height="100" fill="black"/>
      <g filter="url(#soft)">
        <polygon points="25,25 75,25 50,75" fill="white">
          <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="-360 50 50" dur="2s" repeatCount="indefinite"/>
        </polygon>
        <polygon points="50,25 75,75 25,75" fill="white">
          <animateTransform attributeName="transform" type="rotate" from="0 50 60" to="360 50 60" dur="2s" begin="-0.66s" repeatCount="indefinite"/>
        </polygon>
        <polygon points="35,35 65,35 50,65" fill="white">
          <animateTransform attributeName="transform" type="rotate" from="0 40 40" to="-360 40 40" dur="2s" begin="-1s" repeatCount="indefinite"/>
        </polygon>
      </g>
    </mask>
    <filter id="soft">
      <feGaussianBlur stdDeviation="4"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="8" intercept="-0.2"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <g filter="url(#hue)">
    <circle cx="50" cy="50" r="46" fill="url(#shell)" filter="url(#glow)" stroke="#ffbf48" stroke-width="0.6" stroke-opacity="0.55"/>
    <circle cx="50" cy="50" r="46" fill="none" stroke="#be4a1d" stroke-width="0.6" stroke-opacity="0.45"/>
    <rect width="100" height="100" fill="url(#lava)" mask="url(#clip)"/>
  </g>
</svg>
